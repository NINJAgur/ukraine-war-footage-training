name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check scraper-engine/ inference-engine/ training-engine/ web-app/backend/ shared/

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [scraper-engine, inference-engine, training-engine, web-app/backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: |
          set -e
          # CI has no GPU: swap the cu121 torch pins for CPU wheels, and skip
          # groundingdino (needs torch present at build time; no unit test imports it).
          if grep -q "cu121" ${{ matrix.service }}/requirements.txt; then
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            grep -v "^torch\|^torchvision\|^--extra-index\|^groundingdino" \
              ${{ matrix.service }}/requirements.txt > /tmp/req_ci.txt
            pip install -r /tmp/req_ci.txt
          else
            pip install -r ${{ matrix.service }}/requirements.txt
          fi
          pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/unit
        working-directory: ${{ matrix.service }}

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-app/frontend/package-lock.json
      - run: npm ci
        working-directory: web-app/frontend
      - run: npm run build
        working-directory: web-app/frontend
